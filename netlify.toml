[build]
  command = "npm run test:run && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Everything under /assets/ is content-hashed by Vite, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Artwork and 3D models keep stable file names, so cache them for a day (not forever): a
# replaced file shows up after at most 24 hours. Netlify's default is max-age=0 (revalidate on
# every visit).
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
