<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logos/coachcub-mark.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Alfa Slab One: a free, bold slab-serif "varsity"/collegiate numeral face used for the
         jersey number in JerseyGraphic.tsx -- a block serif reads as a printed team number,
         which a plain condensed sans or any system font doesn't. -->
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />
    <title>CoachCub</title>
    <script>
      // Applies the trainer's theme choice before first paint, same storage key/logic as
      // useTheme.ts -- otherwise the page would flash light (or the OS default) for a frame
      // before React mounts and the hook catches up.
      (function () {
        try {
          var pref = localStorage.getItem('u8-theme') // 'light' | 'dark' | 'system' | null
          var dark =
            pref === 'dark'
              ? true
              : pref === 'light'
                ? false
                : window.matchMedia('(prefers-color-scheme: dark)').matches // 'system' or unset
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          // storage/matchMedia unavailable -- leave light, useTheme.ts will correct it once React mounts
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
